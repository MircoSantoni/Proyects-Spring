spring.application.name=msvc-products
# asignar 0 hace que spring de el puerto de forma automatica
# se puede hacer que port sea una variable de entorno
server.port=${PORT:0}

# aca especificamos el id unico de una instacia al registrarse en eureka con un puerto aleatorio
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# aca  le decimos a nuestro microservicio donde esta el servidor eureka para auto-registrarse
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka


spring.datasource.url=jdbc:mysql://mysql:3306/db_springboot_cloud
spring.datasource.username=root
spring.datasource.password=Merkabath1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin-server:9411/api/v2/spans

