spring.application.name=msvc-products
# asignar 0 hace que spring de el puerto de forma automatica
# se puede hacer que port sea una variable de entorno
server.port=${PORT:0}

# aca especificamos el id unico de una instacia al registrarse en eureka
eureka.instance.instance-id=${spring.cloud.client.hostname}:${spring.application.name}:${random.value}

spring.datasource.url=jdbc:mysql://localhost:3306/db_springboot_cloud
spring.datasource.username=root
spring.datasource.password=Merkabath1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


