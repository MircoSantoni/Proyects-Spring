spring.application.name=msvc-items
server.port=8080

# URL del servicio products
config.baseurl.endpoint.msvc-products=http://msvc-products

# Configuración de Eureka CORREGIDA
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Discovery y Load Balancer
spring.cloud.discovery.enabled=true
spring.cloud.loadbalancer.enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin-server:9411/api/v2/spans

# Logging para debug
logging.level.org.springframework.cloud.client.discovery=DEBUG
logging.level.com.netflix.discovery=DEBUG