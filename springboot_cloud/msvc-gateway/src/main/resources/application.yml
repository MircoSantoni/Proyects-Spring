resilience4j:
  circuitbreaker:
    configs:
      defecto:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
    instances:
      products:
        base-config: defecto
  timelimiter:
    configs:
     defecto:
       timeout-duration: 4s
    instances:
      products:
        base-config: defecto
      
spring:
  cloud:
    gateway:
      routes:
      - id: msvc-products
        uri: lb://msvc-products #  lb es de load balancer 
        predicates: # caracteristicas de ese microservicio
        - Path=/api/products/** # Esta es la ruta base de este microservicio
        - Header=token, \d+ # Aca le estamos pidiendo un header, se le pueden agregar expresiones regulares
        # - Header=Content-Type, application/json
        # - Method=GET, POST # Aca le estamos pidiendo los tipos de solicitudes que se pueden realizar
        # - Query=color # Aca le estamos pidiendo parametros
        # - Cookie=color, azul # Aca le estamos pidiendo una cookie
        filters:
        - CircuitBreaker= products
        - StripPrefix=2 # en este filtro indico cuantos prefijos tiene la ruta, en este caso 2, api/ y luego /products
        - name: EjemploCookie
          args:
              name: User
              message: Hola este es el mensaje personalizado para el microservicio productos
              value: QUe-onda-papuh
      - id: msvc-items
        uri: lb://msvc-items
        predicates:
        - Path=/api/items/**
        filters:
        - StripPrefix=2
        - AddRequestHeader=token-request, whatever
        - AddResponseHeader=token-response, whateverNumber
        - AddRequestParameter=name, Andres
        - SetResponseHeader=Content-Type, text/plain